<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CHOOSE C 心事墙</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        :root {
            --bg-main: #38322d;
            --text-primary: #fff8f0;
            --text-secondary: #e6d9cc;
            --card-bg: rgba(255,255,255,0.08);
            --border-color: rgba(255,240,225,0.22);
            --btn-bg: rgba(201,168,137,0.65);
            --notice-bg: linear-gradient(90deg, rgba(201,168,137,0.45), rgba(180,145,120,0.35));
            --like-gray: #aaa;
            --like-red: #ff4d4f;
        }
        [data-theme="day"] {
            --bg-main: #f8efe8;
            --text-primary: #4a3c30;
            --text-secondary: #6d5b4b;
            --card-bg: rgba(255,255,255,0.7);
            --border-color: rgba(160,125,95,0.3);
            --btn-bg: rgba(201,168,137,0.8);
            --notice-bg: linear-gradient(90deg, rgba(221,186,156,0.6), rgba(200,160,130,0.5));
            --like-gray: #888;
            --like-red: #ff4d4f;
        }
        body {
            background: var(--bg-main);
            min-height: 100vh;
            transition: background 0.6s ease;
        }
        .notice-bar {
            width: 100%;
            background: var(--notice-bg);
            padding: 14px 0;
            overflow: hidden;
            border-bottom: 1px solid var(--border-color);
        }
        .notice-text {
            white-space: nowrap;
            color: var(--text-primary);
            font-size: 14px;
            animation: scroll 120s linear infinite;
        }
        @keyframes scroll {
            0% { transform: translateX(100%); }
            100% { transform: translateX(-100%); }
        }
        .container {
            max-width: 800px;
            width: 100%;
            margin: 20px auto;
            padding: 0 16px;
        }
        .publish-btn {
            width: 100%;
            padding: 16px;
            background: var(--btn-bg);
            border: none;
            border-radius: 22px;
            color: #fff;
            font-size: 17px;
            margin: 10px 0 20px;
            cursor: pointer;
        }
        .filter-tag {
            display: flex;
            gap: 8px;
            margin: 20px 0;
            flex-wrap: wrap;
        }
        .filter-btn {
            padding: 8px 14px;
            border-radius: 18px;
            border: 1px solid var(--border-color);
            background: transparent;
            color: var(--text-primary);
            cursor: pointer;
            font-size: 14px;
            flex: 1;
            min-width: 70px;
            text-align: center;
        }
        .filter-btn.active {
            background: rgba(201,168,137,0.55);
            color: #fff;
        }
        .post-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 20px;
            margin: 16px 0;
        }
        .post-card-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .post-tag {
            color: var(--text-primary);
            font-size: 14px;
        }
        .like-wrap {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .like-btn {
            background: transparent;
            border: none;
            font-size: 18px;
            cursor: pointer;
        }
        .like-btn.no { color: var(--like-gray); }
        .like-btn.yes { color: var(--like-red); }
        .like-num {
            font-size: 13px;
            color: var(--text-secondary);
        }
        .post-content {
            font-size: 15px;
            line-height: 1.7;
            color: var(--text-primary);
            margin-bottom: 10px;
        }
        .post-time {
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 14px;
        }
        .comment-area {
            border-top: 1px solid var(--border-color);
            padding-top: 12px;
        }
        .comment-input-wrap {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
        }
        .comment-input {
            flex: 1;
            padding: 8px 12px;
            border-radius: 16px;
            background: rgba(255,255,255,0.08);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            font-size: 14px;
        }
        .comment-send {
            padding: 8px 14px;
            border-radius: 16px;
            border: none;
            background: rgba(201,168,137,0.5);
            color: #fff;
            cursor: pointer;
        }
        .comment-item {
            font-size: 14px;
            color: var(--text-primary);
            line-height: 1.6;
        }
        .verify-box {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: var(--bg-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            gap: 16px;
            touch-action: none;
        }
        .verify-title {
            font-size: 22px;
            color: var(--text-primary);
        }
        .verify-desc {
            font-size: 15px;
            color: var(--text-secondary);
            text-align: center;
        }
        .slider {
            width: 100%;
            max-width: 320px;
            height: 44px;
            background: rgba(255,255,255,0.12);
            border-radius: 22px;
            position: relative;
            overflow: hidden;
            touch-action: none;
        }
        .slider-block {
            width: 64px; height: 44px;
            background: rgba(201,168,137,0.7);
            border-radius: 22px;
            position: absolute; left: 0; top: 0;
            cursor: grab;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            touch-action: none;
        }
        .slider-text {
            position: absolute;
            width: 100%;
            text-align: center;
            color: var(--text-secondary);
            line-height: 44px;
        }
        .main-box { display: none; }
        .links {
            text-align: center;
            margin-top: 30px;
            font-size: 14px;
        }
        .links a {
            color: var(--text-secondary);
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="notice-bar">
        <div class="notice-text">
            【树洞简介】这里是专属情绪避风港，匿名倾诉，温柔倾听
        </div>
    </div>

    <div class="verify-box" id="verifyBox">
        <div class="verify-title">💌 欢迎来到彩虹树洞</div>
        <div class="verify-desc">滑动滑块，开启你的情绪空间</div>
        <div class="slider">
            <div class="slider-text">温柔滑动进入～</div>
            <div class="slider-block">→</div>
        </div>
    </div>

    <div class="main-box container" id="mainBox">
        <h1 style="color:var(--text-primary);text-align:center;">📜 CHOOSE C 心事墙</h1>
        <button class="publish-btn" onclick="location.href='index.html'">💌 我要倾诉</button>
        <div class="filter-tag">
            <button class="filter-btn active" data-tag="all">全部</button>
            <button class="filter-btn" data-tag="心情">心情</button>
            <button class="filter-btn" data-tag="烦恼">烦恼</button>
            <button class="filter-btn" data-tag="祝福">祝福</button>
            <button class="filter-btn" data-tag="日常">日常</button>
            <button class="filter-btn" data-tag="情感">情感</button>
        </div>
        <div id="postList"></div>
        <p class="links"><a href="lookup.html">🔍 查回复/删帖</a></p>
    </div>

<audio id="bgm" loop>
    <source src="https://assets.mixkit.co/sfx/preview/mixkit-relaxing-piano-ambience-1168.mp3" type="audio/mpeg">
</audio>

<script src="js/supabase-client.js"></script>
<script>
    function setDayNightTheme() {
        const h = new Date().getHours();
        const isDay = h >=6 && h <18;
        document.body.dataset.theme = isDay ? 'day' : 'night';
    }
    setDayNightTheme();
    setInterval(setDayNightTheme, 60000);

    const VERIFY_DAY = 24*60*60*1000;
    function checkVerify(){
        const t = localStorage.getItem('verifyTime');
        return t && Date.now()-t < VERIFY_DAY;
    }

    const slider = document.querySelector('.slider');
    const block = document.querySelector('.slider-block');
    let isMove = false, startX = 0;

    function playBGM(){
        const a = document.getElementById('bgm');
        a.volume = 0.3;
        a.play().catch(()=>{});
    }

    block.addEventListener('pointerdown', e=>{
        isMove=true; startX=e.clientX-block.getBoundingClientRect().left;
        block.setPointerCapture(e.pointerId); e.preventDefault();
    });
    document.addEventListener('pointermove', e=>{
        if(!isMove)return; e.preventDefault();
        const r = slider.getBoundingClientRect();
        let x = e.clientX - r.left - startX;
        if(x<0)x=0;
        if(x > r.width - block.offsetWidth){
            x = r.width - block.offsetWidth;
            localStorage.setItem('verifyTime', Date.now());
            verifyBox.style.display='none'; mainBox.style.display='block';
            playBGM(); loadPosts(); isMove=false;
        }
        block.style.left = x+'px';
    });
    document.addEventListener('pointerup', e=>{
        if(isMove){ block.releasePointerCapture(e.pointerId); isMove=false;
            if(parseInt(block.style.left) < slider.offsetWidth - block.offsetWidth -10) block.style.left='0px';
        }
    });

    block.addEventListener('touchstart', e=>{
        isMove=true; startX=e.touches[0].clientX-block.getBoundingClientRect().left; e.preventDefault();
    });
    document.addEventListener('touchmove', e=>{
        if(!isMove)return; e.preventDefault();
        const r = slider.getBoundingClientRect();
        let x = e.touches[0].clientX - r.left - startX;
        if(x<0)x=0;
        if(x > r.width - block.offsetWidth){
            x = r.width - block.offsetWidth;
            localStorage.setItem('verifyTime', Date.now());
            verifyBox.style.display='none'; mainBox.style.display='block';
            playBGM(); loadPosts(); isMove=false;
        }
        block.style.left = x+'px';
    });
    document.addEventListener('touchend', ()=>{
        if(isMove){ isMove=false;
            if(parseInt(block.style.left) < slider.offsetWidth - block.offsetWidth -10) block.style.left='0px';
        }
    });

    if(checkVerify()){
        verifyBox.style.display='none'; mainBox.style.display='block';
    }

    const LIKE_KEY = "likeList";
    function getLikes(){ return JSON.parse(localStorage.getItem(LIKE_KEY)||"[]"); }
    function saveLikes(l){ localStorage.setItem(LIKE_KEY, JSON.stringify(l)); }

    let currentTag='all';
    async function loadPosts(){
        let q = supabaseClient.from('posts').select('*').eq('is_public',true).order('created_at',{ascending:false});
        if(currentTag!=='all') q = q.eq('tag', currentTag);
        const {data} = await q;
        const my = getLikes();
        postList.innerHTML = data.map(p=>{
            const rep = Array.isArray(p.replies)?p.replies:[];
            const liked = my.includes(p.id);
            return `
            <div class="post-card">
                <div class="post-card-top">
                    <span class="post-tag">【${p.tag}】</span>
                    <div class="like-wrap">
                        <button class="like-btn ${liked?'yes':'no'}" onclick="like(${p.id},${p.like_count},${liked})">${liked?'❤️':'🤍'}</button>
                        <span class="like-num">${p.like_count}</span>
                    </div>
                </div>
                <div class="post-content">${p.content}</div>
                <div class="post-time">${new Date(p.created_at).toLocaleString()}</div>
                ${p.is_comment_open?`
                <div class="comment-area">
                    <div class="comment-input-wrap">
                        <input class="comment-input" id="c${p.id}" placeholder="评论...">
                        <button class="comment-send" onclick="send(${p.id})">发送</button>
                    </div>
                    <div>${rep.map(r=>`<div class="comment-item">${r.content||r}</div>`).join('') || '<div class="comment-item" style=color:var(--text-secondary)>暂无评论</div>'}</div>
                </div>`:'<div style=color:var(--text-secondary)>评论已关闭</div>'}
            </div>`;
        }).join('');
    }

    async function like(id,num,is){
        let l = getLikes();
        if(is){
            l = l.filter(i=>i!==id);
            await supabaseClient.from('posts').update({like_count:num-1}).eq('id',id);
        }else{
            l.push(id);
            await supabaseClient.from('posts').update({like_count:num+1}).eq('id',id);
        }
        saveLikes(l); loadPosts();
    }

    async function send(id){
        const i = document.getElementById('c'+id);
        const c = i.value.trim();
        if(!c)return;
        const {data} = await supabaseClient.from('posts').select('replies').eq('id',id).single();
        const arr = Array.isArray(data.replies) ? [...data.replies] : [];
        arr.push({content:c});
        await supabaseClient.from('posts').update({replies:arr}).eq('id',id);
        i.value=''; loadPosts();
    }

    document.querySelectorAll('.filter-btn').forEach(b=>{
        b.onclick=()=>{
            document.querySelectorAll('.filter-btn').forEach(i=>i.classList.remove('active'));
            b.classList.add('active'); currentTag=b.dataset.tag; loadPosts();
        }
    });
</script>
</body>
</html>
