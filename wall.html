<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CHOOSE C 心事墙</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        :root {
            --bg-main: #38322d;
            --text-primary: #fff8f0;
            --text-secondary: #e6d9cc;
            --card-bg: rgba(255,255,255,0.08);
            --border-color: rgba(255,240,225,0.22);
            --btn-bg: rgba(201,168,137,0.65);
            --notice-bg: linear-gradient(90deg, rgba(201,168,137,0.45), rgba(180,145,120,0.35));
            --like-gray: #aaa;
            --like-red: #ff4d4f;
            --official-bg: rgba(201,168,137,0.15);
        }
        [data-theme="day"] {
            --bg-main: #f8efe8;
            --text-primary: #4a3c30;
            --text-secondary: #6d5b4b;
            --card-bg: rgba(255,255,255,0.7);
            --border-color: rgba(160,125,95,0.3);
            --btn-bg: rgba(201,168,137,0.8);
            --notice-bg: linear-gradient(90deg, rgba(221,186,156,0.6), rgba(200,160,130,0.5));
            --like-gray: #888;
            --like-red: #ff4d4f;
            --official-bg: rgba(201,168,137,0.2);
        }
        body {
            background: var(--bg-main);
            min-height: 100vh;
            transition: background 0.6s ease;
        }
        .notice-bar {
            width:100%;background:var(--notice-bg);padding:14px 0;overflow:hidden;border-bottom:1px solid var(--border-color);
        }
        .notice-text {white-space:nowrap;color:var(--text-primary);font-size:14px;animation:scroll 120s linear infinite;}
        @keyframes scroll{0%{transform:translateX(100%);}100%{transform:translateX(-100%);}}
        .container {max-width:800px;width:100%;margin:20px auto;padding:0 16px;}
        .publish-btn {width:100%;padding:16px;background:var(--btn-bg);border:none;border-radius:22px;color:#fff;font-size:17px;margin:10px 0 20px;cursor:pointer;}
        .filter-tag {display:flex;gap:8px;margin:20px 0;flex-wrap:wrap;}
        .filter-btn {padding:8px 12px;border-radius:18px;border:1px solid var(--border-color);background:transparent;color:var(--text-primary);cursor:pointer;font-size:13px;flex:1;min-width:85px;text-align:center;}
        .filter-btn.active {background:rgba(201,168,137,0.55);color:#fff;}
        .post-card {background:var(--card-bg);border:1px solid var(--border-color);border-radius:24px;padding:20px;margin:16px 0;}
        .post-card-top {display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
        .post-tag {color:var(--text-primary);font-size:14px;}
        .like-wrap {display:flex;align-items:center;gap:4px;}
        .like-btn {background:transparent;border:none;font-size:18px;cursor:pointer;}
        .like-btn.no {color:var(--like-gray);}.like-btn.yes {color:var(--like-red);}
        .like-num {font-size:13px;color:var(--text-secondary);}
        .post-content {font-size:15px;line-height:1.7;color:var(--text-primary);margin-bottom:10px;}
        .post-time {font-size:12px;color:var(--text-secondary);margin-bottom:14px;}
        .comment-area {border-top:1px solid var(--border-color);padding-top:12px;margin-top:10px;}
        .comment-input-wrap {display:flex;gap:8px;margin-bottom:12px;}
        .comment-input {flex:1;padding:8px 12px;border-radius:16px;background:rgba(255,255,255,0.08);border:1px solid var(--border-color);color:var(--text-primary);font-size:14px;}
        .comment-send {padding:8px 14px;border-radius:16px;border:none;background:var(--btn-bg);color:#fff;cursor:pointer;}
        .comment-close-tip {font-size:13px;color:var(--text-secondary);margin-bottom:8px;}
        .comment-list {margin-top:10px;}
        .comment-item {font-size:14px;color:var(--text-primary);line-height:1.6;margin:8px 0;padding:8px 12px;border-radius:12px;background:rgba(255,255,255,0.05);}
        .comment-item.official {
            background: var(--official-bg);
            font-weight: 500;
        }
        .comment-time {font-size:11px;color:var(--text-secondary);margin-top:4px;}
        .links {text-align:center;margin-top:30px;font-size:14px;}
        .links a {color:var(--text-secondary);text-decoration:none;}
    </style>
</head>
<body>
    <div class="notice-bar">
        <div class="notice-text">【CHOOSE C 树洞】专属情绪避风港 | 匿名倾诉 | 温柔倾听 | 守护你的所有心事</div>
    </div>
    <div class="container">
        <h1 style="color:var(--text-primary);text-align:center;margin-bottom:10px;">📜 CHOOSE C 心事墙</h1>
        <button class="publish-btn" onclick="location.href='post.html'">💌 我要倾诉</button>
        <div class="filter-tag">
            <button class="filter-btn active" data-tag="all">全部</button>
            <button class="filter-btn" data-tag="生活日常类">生活日常</button>
            <button class="filter-btn" data-tag="情感恋爱类">情感恋爱</button>
            <button class="filter-btn" data-tag="职场/学业类">职场学业</button>
            <button class="filter-btn" data-tag="自我情绪类">自我情绪</button>
            <button class="filter-btn" data-tag="兴趣与圈层类">兴趣圈层</button>
            <button class="filter-btn" data-tag="互动功能区">互动专区</button>
        </div>
        <div id="postList"></div>
        <p class="links"><a href="lookup.html">🔍 查回复/删帖</a> | <a href="admin.html">🔐 管理后台</a></p>
    </div>

<script src="js/supabase-client.js"></script>
<script>
    const VERIFY_DAY = 24*60*60*1000;
    const verifyTime = localStorage.getItem('verifyTime');
    if(!verifyTime || Date.now()-parseInt(verifyTime) > VERIFY_DAY){location.href='index.html';}

    function setTheme(){const h=new Date().getHours();document.body.dataset.theme=h>=6&&h<18?'day':'night';}
    setTheme();setInterval(setTheme,60000);

    const LIKE_KEY="likeList";
    function getLikes(){return JSON.parse(localStorage.getItem(LIKE_KEY)||"[]");}
    function saveLikes(l){localStorage.setItem(LIKE_KEY,JSON.stringify(l));}

    let currentTag='all';
    async function loadPosts(){
        let q=supabaseClient.from('posts').select('*').eq('is_public',true).order('created_at',{ascending:false});
        if(currentTag!=='all')q=q.eq('tag',currentTag);
        const {data:posts}=await q;
        const myLikes=getLikes();

        // 加载所有评论
        const {data:allComments}=await supabaseClient
            .from('comments')
            .select('*')
            .order('created_at',{ascending:true});

        postList.innerHTML=posts.map(p=>{
            const isLiked=myLikes.includes(p.id);
            // 筛选当前帖子的评论
            const postComments=allComments.filter(c=>c.post_id===p.id);
            
            return `
            <div class="post-card">
                <div class="post-card-top">
                    <span class="post-tag">【${p.tag}】</span>
                    <div class="like-wrap">
                        <button class="like-btn ${isLiked?'yes':'no'}" onclick="toggleLike(${p.id},${p.like_count||0},${isLiked})">${isLiked?'❤️':'🤍'}</button>
                        <span class="like-num">${p.like_count||0}</span>
                    </div>
                </div>
                <div class="post-content">${p.content}</div>
                <div class="post-time">${new Date(p.created_at).toLocaleString()}</div>
                <div class="comment-area">
                    ${p.allow_publish ? `
                    <div class="comment-input-wrap">
                        <input class="comment-input" id="c${p.id}" placeholder="写下你的评论...">
                        <button class="comment-send" onclick="sendComment(${p.id})">发送</button>
                    </div>`:`<div class="comment-close-tip">💬 评论已关闭（仅查看历史回复）</div>`}
                    <div class="comment-list">
                        ${p.reply ? `<div class="comment-item official"><b>官方回复：</b>${p.reply}</div>` : ''}
                        ${postComments.map(c=>`
                            <div class="comment-item ${c.is_official ? 'official' : ''}">
                                ${c.is_official ? '<b>官方回复：</b>' : ''}${c.content}
                                <div class="comment-time">${new Date(c.created_at).toLocaleString()}</div>
                            </div>
                        `).join('')}
                        ${!p.reply && postComments.length===0 ? '<div class="comment-item" style="color:var(--text-secondary)">暂无回复</div>' : ''}
                    </div>
                </div>
            </div>`;
        }).join('');
    }

    async function toggleLike(id,count,isLiked){
        let likes=getLikes();
        if(isLiked){
            likes=likes.filter(i=>i!==id);
            await supabaseClient.from('posts').update({like_count:count-1}).eq('id',id);
        }else{
            likes.push(id);
            await supabaseClient.from('posts').update({like_count:count+1}).eq('id',id);
        }
        saveLikes(likes);
        loadPosts();
    }

    // 用户评论提交
    async function sendComment(postId){
        const input=document.getElementById(`c${postId}`);
        const content=input.value.trim();
        if(!content)return alert('请输入评论内容');

        const {error}=await supabaseClient
            .from('comments')
            .insert([{post_id:postId, content:content, is_official:false}]);
        
        if(error){
            alert('评论失败：'+error.message);
            return;
        }

        input.value='';
        loadPosts();
    }

    document.querySelectorAll('.filter-btn').forEach(btn=>{
        btn.onclick=()=>{
            document.querySelectorAll('.filter-btn').forEach(i=>i.classList.remove('active'));
            btn.classList.add('active');
            currentTag=btn.dataset.tag;
            loadPosts();
        };
    });
    loadPosts();
</script>
</body>
</html>
