<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>我要倾诉 | CHOOSE C 树洞</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {margin:0;padding:0;box-sizing:border-box;font-family:"PingFang SC","Microsoft YaHei",sans-serif;-webkit-tap-highlight-color:transparent;}
        :root {--bg-main:#38322d;--text-primary:#fff8f0;--text-secondary:#e6d9cc;--border-color:rgba(255,240,225,0.22);--btn-bg:rgba(201,168,137,0.65);}
        [data-theme="day"]{--bg-main:#f8efe8;--text-primary:#4a3c30;--text-secondary:#6d5b4b;--border-color:rgba(160,125,95,0.3);--btn-bg:rgba(201,168,137,0.8);}
        body{background:var(--bg-main);padding:20px 16px;min-height:100vh;transition:background 0.6s;touch-action: manipulation;}
        .bgm-toggle{position:fixed;top:15px;right:15px;width:40px;height:40px;border-radius:50%;background:rgba(201,168,137,0.7);color:#fff;border:none;font-size:18px;cursor:pointer;z-index:9999;}
        .container{max-width:800px;margin:0 auto;}
        h1{text-align:center;color:var(--text-primary);margin-bottom:10px;}
        .subtitle{text-align:center;color:var(--text-secondary);margin-bottom:24px;}
        textarea{width:100%;min-height:180px;padding:14px;border-radius:18px;background:rgba(255,255,255,0.08);border:1px solid var(--border-color);color:var(--text-primary);font-size:15px;resize:none;}
        .category-group{margin:16px 0;}
        .category-title{color:var(--text-secondary);margin-bottom:10px;}
        .category-list{display:flex;gap:10px;flex-wrap:wrap;}
        .category-item{padding:8px 12px;border:1px solid var(--border-color);border-radius:18px;color:var(--text-primary);cursor:pointer;font-size:13px;}
        .category-item.active{background:rgba(201,168,137,0.6);color:#fff;}
        .public-toggle{display:flex;align-items:center;gap:8px;margin:10px 0;color:var(--text-primary);}
        #submitBtn{width:100%;padding:16px;background:var(--btn-bg);border:none;border-radius:22px;color:#fff;font-size:17px;cursor:pointer;margin:20px 0;}
        #resultBox{display:none;text-align:center;margin-top:20px;color:var(--text-primary);}
        .copy-btn{padding:8px 16px;background:rgba(201,168,137,0.4);border-radius:20px;color:#fff;cursor:pointer;border:none;}
        .links{text-align:center;margin-top:20px;}
        .links a{color:var(--text-secondary);text-decoration:none;}
        audio { display: none; }
    </style>
</head>
<body>
    <button class="bgm-toggle" id="bgmToggle">🔊</button>
    <audio id="bgm" loop preload="auto" src="https://assets.mixkit.co/sfx/preview/mixkit-relaxing-piano-ambience-1168.mp3">

<div class="container">
    <h1>📮 我要倾诉</h1>
    <p class="subtitle">匿名投稿，温柔倾听，你的心事有人懂</p>
    <textarea id="contentInput" maxlength="800" placeholder="写下你的心事，投入树洞..."></textarea>
    <div class="category-group">
        <div class="category-title">选择分类</div>
        <div class="category-list">
            <div class="category-item active" data-cate="生活日常类">1. 生活日常类</div>
            <div class="category-item" data-cate="情感恋爱类">2. 情感恋爱类</div>
            <div class="category-item" data-cate="职场/学业类">3. 职场/学业类</div>
            <div class="category-item" data-cate="自我情绪类">4. 自我情绪类</div>
            <div class="category-item" data-cate="兴趣与圈层类">5. 兴趣与圈层类</div>
            <div class="category-item" data-cate="互动功能区">6. 互动功能区</div>
        </div>
    </div>
    <div class="public-toggle">
        <input type="checkbox" id="publicCheck" checked>
        <label>匿名公开到心事墙</label>
    </div>
    <div class="public-toggle">
        <input type="checkbox" id="commentCheck" checked>
        <label>开放评论功能</label>
    </div>
    <div class="public-toggle">
        <input type="checkbox" id="allowPublishCheck">
        <label>允许CHOOS C摘取到官方公众号</label>
    </div>
    <button id="submitBtn">投入树洞</button>
    <div id="resultBox">
        <p>✅ 投稿成功！请保存你的专属暗号：</p>
        <div style="margin:10px 0;"><span id="secretDisplay" style="font-size:18px;font-weight:bold;"></span><button class="copy-btn" onclick="copySecret()">复制暗号</button></div>
        <p>⚠️ 暗号仅显示一次，丢失无法找回，请妥善保存</p>
    </div>
    <p class="links"><a href="wall.html">← 返回心事墙</a></p>
</div>

<script src="js/supabase-client.js"></script>
<script>
    const VERIFY_DAY=24*60*60*1000;
    const verifyTime=localStorage.getItem('verifyTime');
    if(!verifyTime||Date.now()-parseInt(verifyTime)>VERIFY_DAY){location.href='index.html';}
    function setTheme(){const h=new Date().getHours();document.body.dataset.theme=h>=6&&h<18?'day':'night';}setTheme();

    // ========== 微信BGM终极兼容 ==========
    const bgm = document.getElementById('bgm');
    bgm.volume = 0.3;
    const bgmToggle=document.getElementById('bgmToggle');

    document.addEventListener('WeixinJSBridgeReady', function() {
        bgm.load();
        if(localStorage.getItem('bgmPlaying') === 'true'){
            bgm.play().catch(()=>{});
        }
    }, false);

    document.addEventListener('touchstart', function() {
        if(bgm.paused && localStorage.getItem('bgmPlaying') !== 'false'){
            bgm.play().catch(()=>{});
            bgmToggle.textContent = '🔊';
            localStorage.setItem('bgmPlaying', 'true');
        }
    }, {passive: true});

    document.addEventListener('click', function() {
        if(bgm.paused && localStorage.getItem('bgmPlaying') !== 'false'){
            bgm.play().catch(()=>{});
            bgmToggle.textContent = '🔊';
            localStorage.setItem('bgmPlaying', 'true');
        }
    });

    bgmToggle.onclick = function(e) {
        e.stopPropagation();
        if(bgm.paused){
            bgm.play().catch(()=>{});
            bgmToggle.textContent = '🔊';
            localStorage.setItem('bgmPlaying', 'true');
        }else{
            bgm.pause();
            bgmToggle.textContent = '🔇';
            localStorage.setItem('bgmPlaying', 'false');
        }
    };

    if(localStorage.getItem('bgmPlaying') === 'true'){
        bgm.play().catch(()=>{
            bgmToggle.textContent = '🔇';
            localStorage.setItem('bgmPlaying', 'false');
        });
    }else{
        bgmToggle.textContent = '🔇';
    }

    const bgmList={
        "生活日常类":"https://assets.mixkit.co/sfx/preview/mixkit-relaxing-piano-ambience-1168.mp3",
        "情感恋爱类":"https://assets.mixkit.co/sfx/preview/mixkit-romantic-piano-ambience-1171.mp3",
        "职场/学业类":"https://assets.mixkit.co/sfx/preview/mixkit-calm-study-ambience-1172.mp3",
        "自我情绪类":"https://assets.mixkit.co/sfx/preview/mixkit-sad-piano-melody-1169.mp3",
        "兴趣与圈层类":"https://assets.mixkit.co/sfx/preview/mixkit-dreamy-night-time-ambience-1170.mp3",
        "互动功能区":"https://assets.mixkit.co/sfx/preview/mixkit-happy-bells-notification-937.mp3"
    };
    let currentCate="生活日常类";
    function changeBGM(cate){
        bgm.src=bgmList[cate];
        bgm.volume=0.3;
        if(localStorage.getItem('bgmPlaying')==='true')bgm.play().catch(()=>{});
    }
    document.querySelectorAll('.category-item').forEach(item=>{
        item.onclick=()=>{document.querySelectorAll('.category-item').forEach(i=>i.classList.remove('active'));item.classList.add('active');currentCate=item.dataset.cate;changeBGM(currentCate);}
    });
    async function submitPost(){
        const content=contentInput.value.trim();if(!content)return alert('请输入你的心事');
        const secret=Math.random().toString(36).slice(2,10);
        await supabaseClient.from('posts').insert([{
            content,tag:currentCate,is_public:publicCheck.checked,
            allow_publish:allowPublishCheck.checked,secret_code:secret,like_count:0,reply:null
        }]);
        resultBox.style.display='block';secretDisplay.innerText=secret;contentInput.value='';
    }
    function copySecret(){navigator.clipboard.writeText(secretDisplay.innerText).then(()=>alert('复制成功'));}
    submitBtn.onclick=submitPost;changeBGM(currentCate);
</script>
</body>
</html>
