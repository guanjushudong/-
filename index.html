<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>我要倾诉</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            margin:0; padding:0; box-sizing:border-box;
            font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        :root {
            --bg-main: #38322d;
            --text-primary: #fff8f0;
            --text-secondary: #e6d9cc;
            --border-color: rgba(255,240,225,0.22);
            --btn-bg: rgba(201,168,137,0.65);
        }
        [data-theme="day"] {
            --bg-main: #f8efe8;
            --text-primary: #4a3c30;
            --text-secondary: #6d5b4b;
            --border-color: rgba(160,125,95,0.3);
            --btn-bg: rgba(201,168,137,0.8);
        }
        body {
            background: var(--bg-main);
            padding: 20px 16px;
            min-height: 100vh;
            transition: background 0.6s;
        }
        .container { max-width:800px; margin:0 auto; }
        h1 { text-align:center; color:var(--text-primary); margin-bottom:10px; }
        .subtitle { text-align:center; color:var(--text-secondary); margin-bottom:24px; }
        textarea {
            width:100%; min-height:160px; padding:14px; border-radius:18px;
            background:rgba(255,255,255,0.08); border:1px solid var(--border-color);
            color:var(--text-primary); font-size:15px; resize:none;
        }
        .category-group { margin:16px 0; }
        .category-title { color:var(--text-secondary); margin-bottom:10px; }
        .category-list { display:flex; gap:10px; flex-wrap:wrap; }
        .category-item {
            padding:8px 16px; border:1px solid var(--border-color); border-radius:18px;
            color:var(--text-primary); cursor:pointer;
        }
        .category-item.active {
            background:rgba(201,168,137,0.6); color:#fff;
        }
        .public-toggle {
            display:flex; align-items:center; gap:8px;
            margin:10px 0; color:var(--text-primary);
        }
        .slider {
            width:100%; max-width:320px; height:44px;
            background:rgba(255,255,255,0.12); border-radius:22px;
            position:relative; margin:20px auto; touch-action:none;
        }
        .slider-block {
            width:64px; height:44px; background:rgba(201,168,137,0.7);
            border-radius:22px; position:absolute; left:0; top:0;
            display:flex; align-items:center; justify-content:center;
            color:#fff; cursor:grab; touch-action:none;
        }
        .slider-text {
            position:absolute; width:100%; text-align:center;
            color:var(--text-secondary); line-height:44px;
        }
        #submitBtn {
            width:100%; padding:16px; background:var(--btn-bg);
            border:none; border-radius:22px; color:#fff; font-size:17px; cursor:pointer;
        }
        #resultBox { display:none; text-align:center; margin-top:20px; color:var(--text-primary); }
        .copy-btn {
            padding:8px 16px; background:rgba(201,168,137,0.4);
            border-radius:20px; color:#fff; cursor:pointer; border:none;
        }
        .links { text-align:center; margin-top:20px; }
        .links a { color:var(--text-secondary); text-decoration:none; }
    </style>
</head>
<body>
<div class="container">
    <h1>📮 我要倾诉</h1>
    <p class="subtitle">匿名投稿，温柔倾听</p>
    <textarea id="contentInput" maxlength="500" placeholder="写下你的心事..."></textarea>

    <div class="category-group">
        <div class="category-title">选择分类</div>
        <div class="category-list">
            <div class="category-item active" data-cate="心情">心情</div>
            <div class="category-item" data-cate="烦恼">烦恼</div>
            <div class="category-item" data-cate="祝福">祝福</div>
            <div class="category-item" data-cate="日常">日常</div>
            <div class="category-item" data-cate="情感">情感</div>
        </div>
    </div>

    <div class="public-toggle">
        <input type="checkbox" id="publicCheck" checked>
        <label>公开到心事墙</label>
    </div>
    <div class="public-toggle">
        <input type="checkbox" id="commentCheck" checked>
        <label>开放评论</label>
    </div>

    <div class="slider">
        <div class="slider-text">滑动验证（验证后播放BGM）</div>
        <div class="slider-block">→</div>
    </div>

    <button id="submitBtn">提交投稿</button>

    <div id="resultBox">
        <p>✅ 投稿成功！你的暗号：</p>
        <div style="margin:10px 0;">
            <span id="secretDisplay"></span>
            <button class="copy-btn" onclick="copy()">复制</button>
        </div>
        <p>⚠️ 请妥善保存</p>
    </div>

    <p class="links"><a href="wall.html">← 返回心事墙</a></p>
</div>

<audio id="bgmAudio" loop></audio>
<script src="js/supabase-client.js"></script>
<script>
    const VERIFY = 24*60*60*1000;
    if(!localStorage.getItem('verifyTime') || Date.now()-localStorage.getItem('verifyTime')>VERIFY){
        location.href='wall.html';
    }

    function setTheme(){
        const h = new Date().getHours();
        document.body.dataset.theme = h>=6&&h<18 ? 'day' : 'night';
    }
    setTheme();

    const bgmList = {
        "心情":"https://assets.mixkit.co/sfx/preview/mixkit-dreamy-night-time-ambience-1170.mp3",
        "烦恼":"https://assets.mixkit.co/sfx/preview/mixkit-sad-piano-melody-1169.mp3",
        "祝福":"https://assets.mixkit.co/sfx/preview/mixkit-happy-bells-notification-937.mp3",
        "日常":"https://assets.mixkit.co/sfx/preview/mixkit-relaxing-piano-ambience-1168.mp3",
        "情感":"https://assets.mixkit.co/sfx/preview/mixkit-romantic-piano-ambience-1171.mp3"
    };
    const audio = document.getElementById('bgmAudio');
    let verifyPass = false;
    let cate = "心情";

    function changeBGM(c){
        audio.src = bgmList[c];
        audio.volume = 0.3;
        if(verifyPass) audio.play().catch(()=>{});
    }

    const slider = document.querySelector('.slider');
    const block = document.querySelector('.slider-block');
    let isMove=false, startX=0;

    block.addEventListener('pointerdown', e=>{
        isMove=true; startX=e.clientX-block.getBoundingClientRect().left;
        block.setPointerCapture(e.pointerId); e.preventDefault();
    });
    document.addEventListener('pointermove', e=>{
        if(!isMove)return; e.preventDefault();
        const r = slider.getBoundingClientRect();
        let x = e.clientX - r.left - startX;
        if(x>0 && x < r.width-block.offsetWidth) block.style.left=x+'px';
        if(x >= r.width-block.offsetWidth){
            verifyPass=true; block.style.left = r.width-block.offsetWidth+'px';
            document.querySelector('.slider-text').textContent='✅ 验证成功';
            audio.play().catch(()=>{});
            isMove=false;
        }
    });
    document.addEventListener('pointerup', e=>{
        if(isMove){ block.releasePointerCapture(e.pointerId); isMove=false; if(!verifyPass) block.style.left='0px'; }
    });

    document.querySelectorAll('.category-item').forEach(i=>{
        i.onclick=()=>{
            document.querySelectorAll('.category-item').forEach(x=>x.classList.remove('active'));
            i.classList.add('active'); cate=i.dataset.cate; changeBGM(cate);
        }
    });

    async function submit(){
        const c = contentInput.value.trim();
        if(!c)return alert('请输入内容');
        if(!verifyPass)return alert('请完成验证');

        const secret = Math.random().toString(36).slice(2,10);
        await supabaseClient.from('posts').insert([{
            content:c, tag:cate,
            is_public:publicCheck.checked,
            is_comment_open:commentCheck.checked,
            secret_code:secret, like_count:0, replies:[]
        }]);

        resultBox.style.display='block';
        secretDisplay.innerText=secret;
        contentInput.value='';
    }

    function copy(){
        navigator.clipboard.writeText(secretDisplay.innerText);
        alert('复制成功');
    }

    submitBtn.onclick = submit;
    changeBGM(cate);
</script>
</body>
</html>
