<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHOOSE C树洞 - 向树洞倾诉心事</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="container">
        <h1>📮 CHOOSE C 树洞</h1>
        <p class="subtitle">向 CHOOSE C 树洞，悄悄诉说你的心事</p>
        <textarea id="contentInput" placeholder="写下你的心事，投入 CHOOSE C 树洞..." maxlength="500" required></textarea>
        
        <div class="public-toggle">
            <input type="checkbox" id="publicCheck" checked>
            <label for="publicCheck">匿名公开到 CHOOSE C 心事墙（可被回复）</label>
        </div>

        <div class="public-toggle">
            <input type="checkbox" id="articleCheck">
            <label for="articleCheck">允许 CHOOSE C 将我的内容匿名发布到公众号文章</label>
        </div>
        
        <button id="submitBtn">投入 CHOOSE C 树洞</button>
        
        <div id="resultBox" style="display:none;">
            <p>✅ 已投入 CHOOSE C 树洞！请务必保存你的暗号，用于查看回复：</p>
            <div class="secret-code" id="secretDisplay"></div>
            <p class="warning">⚠️ 暗号仅显示一次，关闭页面后无法找回</p>
        </div>
        
        <p class="links">
            <a href="wall.html">去看看 CHOOSE C 心事墙</a> | <a href="lookup.html">我有暗号，查回复</a>
        </p>
    </div>
    
    <script src="js/supabase-client.js"></script>
    <script>
        // ====================== 完整违禁词库（覆盖辱骂、色情、暴力、政治、违规） ======================
        const forbiddenWords = [
            // 脏话辱骂类
            "傻逼", "废物", "去死", "滚", "脑残", "垃圾", "杂种", "狗东西", "尼玛", "你妈", "草", "艹",
            "有病", "憨憨", "弱智", "缺德", "贱人", "婊子", "畜生", "王八", "垃圾人", "死全家",
            "狗逼", "*********", "*********", "日你妈", "去死吧", "滚蛋", "去死吧你", "脑瘫", "沙比",
            
            // 低俗色情类
            "色情", "黄片", "约炮", "嫖娼", "做爱", "自慰", "手淫", "裸聊", "性暗示", "开房",
            "淫荡", "骚货", "下体", "性交", "乱搞", "一夜情", "出轨", "绿帽", "AV", "黄图",
            
            // 暴力自残自杀类
            "杀人", "自杀", "自残", "跳楼", "割腕", "爆炸", "家暴", "打人", "报复社会", "恐怖袭击",
            "跳楼自杀", "喝药", "上吊", "纵火", "虐杀", "伤害", "杀人放火",
            
            // 政治敏感/违规类
            "台独", "港独", "反动", "支那", "卖国", "邪教", "法轮功", "分裂国家", "辱骂国家",
            "反动言论", "叛国", "汉奸", "间谍", "暴乱",
            
            // 违法违规类
            "赌博", "毒品", "吸毒", "诈骗", "洗钱", "高利贷", "走私", "贩毒", "卖淫", "嫖娼",
            "刷单", "洗钱", "套现", "非法集资",
            
            // 网络恶意黑话
            "网暴", "人肉", "挂人", "爆破", "网黑", "引战", "带节奏", "地域黑", "歧视", "阴阳怪气"
        ];

        // 违禁词检测函数
        function checkForbiddenWords(content) {
            const lowerContent = content.toLowerCase();
            for (let word of forbiddenWords) {
                if (lowerContent.includes(word)) {
                    return word;
                }
            }
            return null;
        }
        // ==========================================================================================

        function generateSecret() {
            return Math.random().toString(36).substring(2, 10);
        }

        document.getElementById('submitBtn').addEventListener('click', async () => {
            const content = document.getElementById('contentInput').value.trim();
            
            if (!content) return alert('请写下心事，投入 CHOOSE C 树洞');

            // 执行违禁词拦截
            const badWord = checkForbiddenWords(content);
            if (badWord) {
                alert(`内容包含不当用语「${badWord}」，请文明倾诉，温柔表达心事~`);
                return;
            }

            const isPublic = document.getElementById('publicCheck').checked;
            const allowArticle = document.getElementById('articleCheck').checked;
            const secret = generateSecret();

            const { error } = await supabaseClient
                .from('posts')
                .insert([{ content, is_public: isPublic, allow_article: allowArticle, secret_code: secret }]);

            if (error) {
                alert('投稿失败，请重试');
                console.error(error);
                return;
            }

            document.getElementById('resultBox').style.display = 'block';
            document.getElementById('secretDisplay').textContent = secret;
            document.getElementById('contentInput').value = '';
            document.getElementById('publicCheck').checked = true;
            document.getElementById('articleCheck').checked = false;
        });
    </script>
</body>
</html>
