<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHOOSE C树洞</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* 全局日夜模式变量，JS自动切换 */
        :root {
            --bg-main: #38322d;
            --bg-radial1: rgba(201, 168, 137, 0.28);
            --bg-radial2: rgba(180, 145, 120, 0.22);
            --text-main: #ffffff;
            --text-sub: rgba(255,240,225,0.75);
            --border-color: rgba(255, 240, 225, 0.18);
            --glow-color: rgba(212,184,153,0.25);
            --particle-opacity: 0.75;
        }
        /* 白天模式 */
        [data-theme="day"] {
            --bg-main: #f8efe8;
            --bg-radial1: rgba(221, 186, 156, 0.2);
            --bg-radial2: rgba(200, 160, 130, 0.18);
            --text-main: #332c26;
            --text-sub: rgba(80,65,50,0.75);
            --border-color: rgba(200, 165, 135, 0.25);
            --glow-color: rgba(212,184,153,0.35);
            --particle-opacity: 0.6;
        }
        /* 基础组件样式 */
        .copy-btn{padding:8px 16px;background:rgba(201,168,137,0.4);border:1px solid rgba(230,205,185,0.35);border-radius:20px;color:var(--text-main);font-size:14px;cursor:pointer;transition:0.3s;}
        .copy-btn:hover{background:rgba(201,168,137,0.6);transform:scale(1.05);}
        .secret-wrap{display:flex;gap:12px;align-items:center;justify-content:center;margin:10px 0;}
        .slider{width:100%;height:40px;background:rgba(255,255,255,0.1);border-radius:20px;position:relative;margin:20px 0;overflow:hidden;}
        .slider-block{width:60px;height:40px;background:rgba(201,168,137,0.6);border-radius:20px;position:absolute;left:0;top:0;cursor:grab;display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;}
        .slider-text{position:absolute;width:100%;text-align:center;color:var(--text-sub);line-height:40px;}
        .category-group{margin: 16px 0;}
        .category-title{color: var(--text-sub); font-size: 14px; margin-bottom: 10px;}
        .category-list{display: flex; gap: 10px; flex-wrap: wrap;}
        .category-item{padding: 8px 16px; border: 1px solid var(--border-color); border-radius: 18px; color: var(--text-main); font-size: 14px; cursor: pointer; transition: all 0.3s;}
        .category-item.active{background: rgba(201,168,137,0.6); border-color: rgba(201,168,137,0.8);}
    </style>
</head>
<body>
<div class="container">
    <h1>📮 CHOOSE C 树洞</h1>
    <p class="subtitle">向树洞悄悄诉说你的心事</p>
    <textarea id="contentInput" placeholder="写下你的心事，投入树洞..." maxlength="500"></textarea>

    <div class="category-group">
        <div class="category-title">选择帖子分类（切换自动播放对应BGM）：</div>
        <div class="category-list">
            <div class="category-item active" data-cate="心情">😊 心情</div>
            <div class="category-item" data-cate="烦恼">😔 烦恼</div>
            <div class="category-item" data-cate="祝福">✨ 祝福</div>
            <div class="category-item" data-cate="日常">📝 日常</div>
            <div class="category-item" data-cate="情感">❤️ 情感</div>
        </div>
    </div>

    <!-- 严格按照你要求的3个勾选选项 -->
    <div class="public-toggle">
        <input type="checkbox" id="publicCheck" checked>
        <label for="publicCheck">1. 是否展示到心事墙</label>
    </div>
    <div class="public-toggle">
        <input type="checkbox" id="commentCheck">
        <label for="commentCheck">2. 是否开启评论功能</label>
    </div>
    <div class="public-toggle">
        <input type="checkbox" id="articleCheck">
        <label for="articleCheck">3. 允许 CHOOSE C 将我的内容匿名发布到公众号文章</label>
    </div>

    <div class="slider">
        <div class="slider-text">拖动滑块完成验证（验证后自动播放背景音乐）</div>
        <div class="slider-block">→</div>
    </div>

    <button id="submitBtn">投入树洞</button>

    <div id="resultBox" style="display:none;">
        <p>✅ 投稿成功！请务必保存你的暗号：</p>
        <div class="secret-wrap">
            <div class="secret-code" id="secretDisplay"></div>
            <button class="copy-btn" id="copyBtn">一键复制暗号</button>
        </div>
        <p class="warning">⚠️ 暗号仅显示一次，关闭页面无法找回</p>
    </div>

    <p class="links"><a href="wall.html">心事墙</a> | <a href="lookup.html">查回复/删帖</a></p>
</div>

<!-- 背景音乐，按分类切换 -->
<audio id="bgmAudio" loop preload="auto">

<script src="js/supabase-client.js"></script>
<script>
    // ========== 1. 日夜模式自动切换 ==========
    function setDayNightTheme() {
        const hour = new Date().getHours();
        const isDay = hour >= 6 && hour < 18;
        document.body.setAttribute('data-theme', isDay ? 'day' : 'night');
    }
    setDayNightTheme();
    setInterval(setDayNightTheme, 60000); // 每分钟自动更新

    // ========== 2. 分类对应背景音乐配置 ==========
    const bgmList = {
        "心情": "https://assets.mixkit.co/sfx/preview/mixkit-dreamy-night-time-ambience-1170.mp3",
        "烦恼": "https://assets.mixkit.co/sfx/preview/mixkit-sad-piano-melody-1169.mp3",
        "祝福": "https://assets.mixkit.co/sfx/preview/mixkit-happy-bells-notification-937.mp3",
        "日常": "https://assets.mixkit.co/sfx/preview/mixkit-relaxing-piano-ambience-1168.mp3",
        "情感": "https://assets.mixkit.co/sfx/preview/mixkit-romantic-piano-ambience-1171.mp3"
    };
    const bgmAudio = document.getElementById('bgmAudio');
    let isBgmPlay = false;

    // 切换分类自动切换BGM
    function changeBGM(cate) {
        bgmAudio.src = bgmList[cate];
        if(isBgmPlay) bgmAudio.play();
    }

    // ========== 3. 原有功能全部保留 ==========
    let forbiddenWords = [];
    let verifyPass = false;
    let selectedCategory = "心情";
    const POST_LIMIT = 60;

    async function loadForbiddenWords() {
        try {
            const res = await fetch('./违禁词.txt');
            const text = await res.text();
            forbiddenWords = text.split(/\r?\n/).map(w => w.trim()).filter(w => w);
        } catch (e) {}
    }

    function checkBadWords(str) {
        return forbiddenWords.some(w => str.toLowerCase().includes(w.toLowerCase()));
    }

    // 滑块验证（验证后开启BGM播放，解决浏览器自动播放限制）
    const slider = document.querySelector('.slider');
    const block = document.querySelector('.slider-block');
    let isMove = false;
    block.addEventListener('mousedown', () => isMove = true);
    document.addEventListener('mousemove', (e) => {
        if (!isMove) return;
        let x = e.clientX - slider.offsetLeft;
        if (x > 0 && x < slider.offsetWidth - 60) block.style.left = x + 'px';
        if (x >= slider.offsetWidth - 60) {
            verifyPass = true;
            block.style.left = slider.offsetWidth - 60 + 'px';
            document.querySelector('.slider-text').textContent = '✅ 验证成功，BGM已开启';
            isBgmPlay = true;
            bgmAudio.play();
        }
    });
    document.addEventListener('mouseup', () => isMove = false);

    // 分类切换
    document.querySelectorAll('.category-item').forEach(item => {
        item.addEventListener('click', () => {
            document.querySelectorAll('.category-item').forEach(i => i.classList.remove('active'));
            item.classList.add('active');
            selectedCategory = item.dataset.cate;
            changeBGM(selectedCategory);
        });
    });

    document.getElementById('copyBtn').onclick = async () => {
        await navigator.clipboard.writeText(document.getElementById('secretDisplay').innerText);
        alert('✅ 暗号复制成功！请妥善保存~');
    }

    document.getElementById('submitBtn').onclick = async () => {
        const content = document.getElementById('contentInput').value.trim();
        if (!content) return alert('请输入你的心事内容~');
        if (checkBadWords(content)) return alert('请文明倾诉后重新提交~');
        if (!verifyPass) return alert('请完成滑块验证~');

        const lastPostTime = localStorage.getItem('lastPostTime');
        const nowTime = Date.now() / 1000;
        if (lastPostTime && nowTime - lastPostTime < POST_LIMIT) {
            return alert(`发帖频繁！请${Math.ceil(POST_LIMIT - (nowTime - lastPostTime))}秒后再试~`);
        }

        const secretCode = Math.random().toString(36).slice(2, 10);
        const { error } = await supabaseClient.from('posts').insert([{
            content,
            tag: selectedCategory,
            is_public: document.getElementById('publicCheck').checked,
            is_comment_open: document.getElementById('commentCheck').checked,
            allow_article: document.getElementById('articleCheck').checked,
            secret_code: secretCode,
            like_count: 0,
            replies: []
        }]);

        if (error) { alert('投稿失败，请稍后重试~'); return; }
        localStorage.setItem('lastPostTime', nowTime);
        document.getElementById('resultBox').style.display = 'block';
        document.getElementById('secretDisplay').textContent = secretCode;
        document.getElementById('contentInput').value = '';
    };

    loadForbiddenWords();
    changeBGM(selectedCategory);
</script>
</body>
</html>
