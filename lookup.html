<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>查回复 / 删帖 | CHOOSE C 树洞</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {margin:0;padding:0;box-sizing:border-box;font-family:"PingFang SC","Microsoft YaHei",sans-serif;}
        :root {
            --bg-main:#38322d;
            --text-primary:#fff8f0;
            --text-secondary:#e6d9cc;
            --border-color:rgba(255,240,225,0.22);
            --official-bg:rgba(201,168,137,0.15);
        }
        [data-theme="day"]{
            --bg-main:#f8efe8;
            --text-primary:#4a3c30;
            --text-secondary:#6d5b4b;
            --border-color:rgba(160,125,95,0.3);
            --official-bg:rgba(201,168,137,0.2);
        }
        body{background:var(--bg-main);padding:20px 16px;min-height:100vh;}
        .container{max-width:800px;margin:0 auto;}
        h1{text-align:center;color:var(--text-primary);margin-bottom:20px;}
        input{width:100%;padding:14px;border-radius:20px;background:rgba(255,255,255,0.08);border:1px solid var(--border-color);color:var(--text-primary);margin-bottom:16px;}
        button{width:100%;padding:14px;border-radius:20px;background:rgba(201,168,137,0.6);color:#fff;border:none;cursor:pointer;}
        #result{margin-top:24px;}
        .post-card{background:rgba(255,255,255,0.08);border:1px solid var(--border-color);border-radius:20px;padding:20px;margin:16px 0;color:var(--text-primary);}
        .del-btn{background:#ff4d4f;margin-top:10px;}
        .comment-item{background:rgba(255,255,255,0.05);padding:10px;border-radius:12px;margin:8px 0;font-size:14px;}
        .comment-item.official{
            background: var(--official-bg);
            font-weight: 500;
        }
        .comment-time{font-size:11px;color:var(--text-secondary);margin-top:4px;}
        .links{text-align:center;margin-top:30px;}
        .links a{color:var(--text-secondary);text-decoration:none;}
    </style>
</head>
<body>
<div class="container">
    <h1>🔍 查询投稿 / 删除帖子</h1>
    <input type="text" id="secretInput" placeholder="输入你的投稿暗号">
    <button onclick="searchPost()">查询</button>
    <div id="result"></div>
    <p class="links"><a href="wall.html">← 返回心事墙</a></p>
</div>

<script src="js/supabase-client.js"></script>
<script>
    const VERIFY_DAY=24*60*60*1000;
    const verifyTime=localStorage.getItem('verifyTime');
    if(!verifyTime||Date.now()-parseInt(verifyTime)>VERIFY_DAY){location.href='index.html';}
    function setTheme(){const h=new Date().getHours();document.body.dataset.theme=h>=6&&h<18?'day':'night';}setTheme();

    async function searchPost(){
        const secret=secretInput.value.trim();if(!secret)return alert('请输入暗号');
        try{
            const {data:post}=await supabaseClient.from('posts').select('*').eq('secret_code',secret).single();
            if(!post)return result.innerHTML='<p style="color:var(--text-primary);text-align:center;">未找到投稿</p>';
            
            // 加载该帖子的所有评论
            const {data:comments}=await supabaseClient
                .from('comments')
                .select('*')
                .eq('post_id', post.id)
                .order('created_at',{ascending:true});

            result.innerHTML=`
            <div class="post-card">
                <div><b>分类：</b>${post.tag}</div>
                <div style="margin:10px 0;"><b>内容：</b>${post.content}</div>
                <div><b>点赞：</b>${post.like_count||0}</div>
                
                <div style="margin-top:15px;margin-bottom:8px;"><b>全部回复：</b></div>
                ${post.reply ? `<div class="comment-item official"><b>官方回复：</b>${post.reply}</div>` : ''}
                ${comments.map(c=>`
                    <div class="comment-item ${c.is_official ? 'official' : ''}">
                        ${c.is_official ? '<b>官方回复：</b>' : ''}${c.content}
                        <div class="comment-time">${new Date(c.created_at).toLocaleString()}</div>
                    </div>
                `).join('')}
                ${!post.reply && comments.length===0 ? '<div class="comment-item" style="color:var(--text-secondary)">暂无回复</div>' : ''}
                
                <button class="del-btn" onclick="deletePost(${post.id},'${secret}')">🗑️ 删除我的投稿</button>
            </div>`;
        }catch(e){result.innerHTML='<p style="color:var(--text-primary);text-align:center;">未找到投稿</p>';}
    }
    async function deletePost(id,secret){
        if(!confirm('确定删除？不可恢复'))return;
        await supabaseClient.from('posts').delete().eq('id',id).eq('secret_code',secret);
        alert('删除成功');result.innerHTML='';secretInput.value='';
    }
</script>
</body>
</html>
