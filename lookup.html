<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>查回复 / 删帖 | CHOOSE C 树洞</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            margin:0; padding:0; box-sizing:border-box;
            font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
        }
        :root {
            --bg-main: #38322d;
            --text-primary: #fff8f0;
            --text-secondary: #e6d9cc;
            --border-color: rgba(255,240,225,0.22);
        }
        [data-theme="day"] {
            --bg-main: #f8efe8;
            --text-primary: #4a3c30;
            --text-secondary: #6d5b4b;
            --border-color: rgba(160,125,95,0.3);
        }
        body {
            background: var(--bg-main);
            padding: 20px 16px;
            min-height: 100vh;
        }
        /* BGM开关 */
        .bgm-toggle {
            position: fixed;
            top: 15px;
            right: 15px;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(201,168,137,0.7);
            color: #fff;
            border: none;
            font-size: 18px;
            cursor: pointer;
            z-index: 9999;
        }
        .container { max-width:800px; margin:0 auto; }
        h1 { text-align:center; color:var(--text-primary); margin-bottom:20px; }
        input {
            width:100%; padding:14px; border-radius:20px;
            background:rgba(255,255,255,0.08); border:1px solid var(--border-color);
            color:var(--text-primary); margin-bottom:16px;
        }
        button {
            width:100%; padding:14px; border-radius:20px;
            background:rgba(201,168,137,0.6); color:#fff; border:none; cursor:pointer;
        }
        #result { margin-top:24px; }
        .post-card {
            background:rgba(255,255,255,0.08); border:1px solid var(--border-color);
            border-radius:20px; padding:20px; margin:16px 0; color:var(--text-primary);
        }
        .del-btn { background:#ff4d4f; margin-top:10px; }
        .comment-item {
            background:rgba(255,255,255,0.08); padding:10px; border-radius:14px; margin:8px 0;
        }
        .links { text-align:center; margin-top:30px; }
        .links a { color:var(--text-secondary); text-decoration:none; }
    </style>
</head>
<body>
    <!-- BGM开关 -->
    <button class="bgm-toggle" id="bgmToggle">🔊</button>

<div class="container">
    <h1>🔍 查询投稿 / 删除帖子</h1>
    <input type="text" id="secretInput" placeholder="输入你的投稿暗号">
    <button onclick="searchPost()">查询</button>
    <div id="result"></div>
    <p class="links"><a href="wall.html">← 返回心事墙</a></p>
</div>

<!-- 全局BGM音频 -->
<audio id="globalBGM" loop preload="auto">
    <source src="https://assets.mixkit.co/sfx/preview/mixkit-relaxing-piano-ambience-1168.mp3" type="audio/mpeg">


<script src="js/supabase-client.js"></script>
<script>
    // 绝对优先验证检查
    const VERIFY_DAY = 24*60*60*1000;
    const verifyTime = localStorage.getItem('verifyTime');
    if(!verifyTime || Date.now()-parseInt(verifyTime) > VERIFY_DAY){
        location.href='index.html';
    }

    // 日夜模式
    function setTheme(){
        const h = new Date().getHours();
        document.body.dataset.theme = h>=6&&h<18 ? 'day' : 'night';
    }
    setTheme();

    // 🔴 BGM控制逻辑
    const bgm = document.getElementById('globalBGM');
    const bgmToggle = document.getElementById('bgmToggle');
    bgm.volume = 0.3;

    // 恢复之前的播放状态
    if(localStorage.getItem('bgmPlaying') === 'true'){
        bgm.play().catch(err => {
            bgmToggle.textContent = '🔇';
            localStorage.setItem('bgmPlaying', 'false');
        });
    }else{
        bgmToggle.textContent = '🔇';
    }

    // BGM开关点击事件
    bgmToggle.onclick = () => {
        if(bgm.paused){
            bgm.play();
            bgmToggle.textContent = '🔊';
            localStorage.setItem('bgmPlaying', 'true');
        }else{
            bgm.pause();
            bgmToggle.textContent = '🔇';
            localStorage.setItem('bgmPlaying', 'false');
        }
    };

    // 查询投稿
    async function searchPost(){
        const secret = secretInput.value.trim();
        if(!secret) return alert('请输入你的投稿暗号');
        
        try {
            const {data} = await supabaseClient.from('posts').select('*').eq('secret_code', secret).single();
            if(!data) return result.innerHTML='<p style="color:var(--text-primary);text-align:center;">未找到该投稿，请检查暗号是否正确</p>';
            
            const replies = Array.isArray(data.replies) ? data.replies : [];
            result.innerHTML = `
            <div class="post-card">
                <div><b>分类：</b>${data.tag}</div>
                <div style="margin:10px 0;"><b>内容：</b>${data.content}</div>
                <div><b>点赞数：</b>${data.like_count}</div>
                <div style="margin-top:10px;">
                    <b>评论：</b>
                    ${replies.map(r=>`<div class="comment-item">${r.content||r}</div>`).join('')||'暂无评论'}
                </div>
                <button class="del-btn" onclick="deletePost(${data.id}, '${secret}')">🗑️ 删除此投稿</button>
            </div>`;
        } catch(e) {
            result.innerHTML='<p style="color:var(--text-primary);text-align:center;">未找到该投稿，请检查暗号是否正确</p>';
        }
    }

    // 删除投稿
    async function deletePost(id, secret){
        if(!confirm('确定要删除这篇投稿吗？删除后无法恢复！')) return;
        
        const {error} = await supabaseClient.from('posts').delete().eq('id', id).eq('secret_code', secret);
        if(error){
            alert('删除失败，请稍后重试');
        }else{
            alert('删除成功！');
            result.innerHTML='';
            secretInput.value='';
        }
    }
</script>
</body>
</html>
