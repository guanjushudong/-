<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>查回复 / 删帖</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            margin:0; padding:0; box-sizing:border-box;
            font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
        }
        :root {
            --bg-main: #38322d;
            --text-primary: #fff8f0;
            --text-secondary: #e6d9cc;
            --border-color: rgba(255,240,225,0.22);
        }
        [data-theme="day"] {
            --bg-main: #f8efe8;
            --text-primary: #4a3c30;
            --text-secondary: #6d5b4b;
            --border-color: rgba(160,125,95,0.3);
        }
        body {
            background: var(--bg-main);
            padding: 20px 16px;
            min-height: 100vh;
        }
        .container { max-width:800px; margin:0 auto; }
        h1 { text-align:center; color:var(--text-primary); margin-bottom:20px; }
        input {
            width:100%; padding:14px; border-radius:20px;
            background:rgba(255,255,255,0.08); border:1px solid var(--border-color);
            color:var(--text-primary); margin-bottom:16px;
        }
        button {
            width:100%; padding:14px; border-radius:20px;
            background:rgba(201,168,137,0.6); color:#fff; border:none; cursor:pointer;
        }
        #result { margin-top:24px; }
        .post-card {
            background:rgba(255,255,255,0.08); border:1px solid var(--border-color);
            border-radius:20px; padding:20px; margin:16px 0; color:var(--text-primary);
        }
        .del-btn { background:#ff4d4f; margin-top:10px; }
        .comment-item {
            background:rgba(255,255,255,0.08); padding:10px; border-radius:14px; margin:8px 0;
        }
        .links { text-align:center; margin-top:30px; }
        .links a { color:var(--text-secondary); text-decoration:none; }
    </style>
</head>
<body>
<div class="container">
    <h1>🔍 查询 / 删除投稿</h1>
    <input type="text" id="key" placeholder="输入你的投稿暗号">
    <button onclick="search()">查询</button>
    <div id="result"></div>
    <p class="links"><a href="wall.html">← 返回心事墙</a></p>
</div>

<script src="js/supabase-client.js"></script>
<script>
    // 验证过期检查（仅检查，不包含滑块）
    const VERIFY_DAY = 24*60*60*1000;
    const verifyTime = localStorage.getItem('verifyTime');
    
    // 验证过期，跳转到首页
    if(!verifyTime || Date.now()-parseInt(verifyTime) > VERIFY_DAY){
        location.href='wall.html';
    }

    // 日夜模式设置
    function setTheme(){
        const h = new Date().getHours();
        document.body.dataset.theme = h>=6&&h<18 ? 'day' : 'night';
    }
    setTheme();

    // 查询投稿
    async function search(){
        const k = key.value.trim();
        if(!k)return alert('请输入暗号');
        try {
            const {data} = await supabaseClient.from('posts').select('*').eq('secret_code',k).single();
            if(!data)return result.innerHTML='<p style=color:var(--text-primary);text-align:center>未找到</p>';
            
            const rep = Array.isArray(data.replies) ? data.replies : [];
            result.innerHTML = `
            <div class="post-card">
                <div>【${data.tag}】</div>
                <div style=margin:10px 0>${data.content}</div>
                <div>点赞：${data.like_count}</div>
                <div style=margin-top:10px><b>评论：</b>${rep.map(r=>`<div class=comment-item>${r.content||r}</div>`).join('')||'暂无评论'}</div>
                <button class=del-btn onclick="del(${data.id},'${k}')">删除投稿</button>
            </div>`;
        } catch(e) {
            result.innerHTML='<p style=color:var(--text-primary);text-align:center>未找到</p>';
        }
    }

    // 删除投稿
    async function del(id,secret){
        if(!confirm('确定删除？'))return;
        const {error} = await supabaseClient.from('posts').delete().eq('id',id).eq('secret_code',secret);
        if(error)alert('删除失败');
        else { alert('删除成功'); result.innerHTML=''; key.value=''; }
    }
</script>
</body>
</html>
