<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>管理后台 | CHOOSE C 树洞</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
        }
        :root {
            --bg-main: #38322d;
            --text-primary: #fff8f0;
            --text-secondary: #e6d9cc;
            --border-color: rgba(255,240,225,0.22);
            --btn-primary: rgba(201,168,137,0.7);
            --btn-danger: #ff4d4f;
            --btn-success: #52c41a;
            --official-bg: rgba(201,168,137,0.15);
        }
        [data-theme="day"] {
            --bg-main: #f8efe8;
            --text-primary: #4a3c30;
            --text-secondary: #6d5b4b;
            --border-color: rgba(160,125,95,0.3);
            --official-bg: rgba(201,168,137,0.2);
        }
        body {
            background: var(--bg-main);
            min-height: 100vh;
            padding: 20px 16px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            color: var(--text-primary);
            margin-bottom: 20px;
        }
        .login-box {
            background: rgba(255,255,255,0.08);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 30px;
            max-width: 400px;
            margin: 100px auto;
        }
        input, textarea {
            width: 100%;
            padding: 14px;
            border-radius: 16px;
            background: rgba(255,255,255,0.08);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            margin-bottom: 16px;
            font-size: 16px;
            resize: vertical;
        }
        button {
            width: 100%;
            padding: 14px;
            border-radius: 16px;
            border: none;
            color: #fff;
            font-size: 16px;
            cursor: pointer;
        }
        .btn-primary {
            background: var(--btn-primary);
        }
        .btn-danger {
            background: var(--btn-danger);
        }
        .btn-success {
            background: var(--btn-success);
        }
        .post-card {
            background: rgba(255,255,255,0.08);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 20px;
            margin: 16px 0;
            color: var(--text-primary);
        }
        .post-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .post-tag {
            color: var(--text-secondary);
            font-size: 14px;
        }
        .post-status {
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 12px;
        }
        .status-open {
            background: rgba(82,196,26,0.2);
            color: #52c41a;
        }
        .status-close {
            background: rgba(255,77,79,0.2);
            color: #ff4d4f;
        }
        .post-content {
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 10px;
        }
        .post-time {
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 10px;
        }
        .official-reply {
            background: var(--official-bg);
            padding: 10px;
            border-radius: 12px;
            margin-bottom: 12px;
            font-size: 14px;
            font-weight: 500;
        }
        .comment-list {
            margin: 12px 0;
            padding-left: 10px;
            border-left: 2px solid var(--border-color);
        }
        .comment-item {
            font-size: 14px;
            line-height: 1.5;
            margin: 8px 0;
            padding: 8px;
            border-radius: 8px;
            background: rgba(255,255,255,0.05);
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }
        .comment-item.official {
            background: var(--official-bg);
            font-weight: 500;
        }
        .comment-time {
            font-size: 11px;
            color: var(--text-secondary);
            margin-top: 4px;
        }
        .del-comment-btn {
            width: auto;
            padding: 4px 8px;
            font-size: 12px;
            background: var(--btn-danger);
            border-radius: 8px;
            margin-left: 10px;
        }
        .official-reply-box {
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px dashed var(--border-color);
        }
        .official-reply-box textarea {
            min-height: 60px;
            margin-bottom: 8px;
        }
        .btn-group {
            display: flex;
            gap: 10px;
        }
        .btn-group button {
            flex: 1;
            padding: 8px;
            font-size: 14px;
        }
        .links {
            text-align: center;
            margin-top: 30px;
        }
        .links a {
            color: var(--text-secondary);
            text-decoration: none;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>🔐 管理员后台</h1>
    
    <!-- 登录界面 -->
    <div id="loginBox" class="login-box">
        <input type="password" id="adminPassword" placeholder="请输入管理员密码">
        <button class="btn-primary" onclick="login()">登录</button>
    </div>

    <!-- 管理界面 -->
    <div id="adminPanel" style="display: none;">
        <div id="postList"></div>
        <p class="links"><a href="wall.html">← 返回心事墙</a></p>
    </div>
</div>

<script src="js/supabase-client.js"></script>
<script>
    // 管理员密码（请修改为你自己的密码）
    const ADMIN_PASSWORD = "choosec123";

    function setTheme(){const h=new Date().getHours();document.body.dataset.theme=h>=6&&h<18?'day':'night';}
    setTheme();

    // 检查是否已登录
    if(localStorage.getItem('adminLoggedIn') === 'true'){
        showAdminPanel();
    }

    // 登录
    function login(){
        const password = adminPassword.value.trim();
        if(password === ADMIN_PASSWORD){
            localStorage.setItem('adminLoggedIn', 'true');
            showAdminPanel();
        }else{
            alert('密码错误');
        }
    }

    // 显示管理面板
    function showAdminPanel(){
        loginBox.style.display = 'none';
        adminPanel.style.display = 'block';
        loadAllPosts();
    }

    // 加载所有帖子和评论
    async function loadAllPosts(){
        const {data:posts, error:postError} = await supabaseClient
            .from('posts')
            .select('*')
            .order('created_at', {ascending: false});
        
        if(postError){
            alert('加载失败：' + postError.message);
            return;
        }

        // 加载所有评论
        const {data:allComments} = await supabaseClient
            .from('comments')
            .select('*')
            .order('created_at',{ascending:true});

        postList.innerHTML = posts.map(p=>{
            const postComments=allComments.filter(c=>c.post_id===p.id);
            return `
            <div class="post-card">
                <div class="post-header">
                    <span class="post-tag">【${p.tag}】 ID: ${p.id}</span>
                    <span class="post-status ${p.allow_publish ? 'status-open' : 'status-close'}">
                        ${p.allow_publish ? '评论已开启' : '评论已关闭'}
                    </span>
                </div>
                <div class="post-content">${p.content}</div>
                <div class="post-time">${new Date(p.created_at).toLocaleString()}</div>
                
                ${p.reply ? `<div class="official-reply"><b>官方回复：</b>${p.reply}</div>` : ''}
                
                ${postComments.length>0 ? `
                <div class="comment-list">
                    <div style="margin-bottom:8px;color:var(--text-secondary);">全部回复 (${postComments.length})：</div>
                    ${postComments.map(c=>`
                        <div class="comment-item ${c.is_official ? 'official' : ''}">
                            <div>
                                ${c.is_official ? '<b>官方回复：</b>' : ''}${c.content}
                                <div class="comment-time">${new Date(c.created_at).toLocaleString()}</div>
                            </div>
                            <button class="del-comment-btn" onclick="deleteComment(${c.id})">删除</button>
                        </div>
                    `).join('')}
                </div>` : ''}
                
                <!-- 🔴 新增：官方回复输入框 -->
                <div class="official-reply-box">
                    <textarea id="officialReply${p.id}" placeholder="输入官方回复内容..."></textarea>
                    <button class="btn-primary" onclick="sendOfficialReply(${p.id})">发送官方回复</button>
                </div>
                
                <div class="btn-group" style="margin-top:12px;">
                    <button class="${p.allow_publish ? 'btn-danger' : 'btn-success'}" 
                            onclick="toggleComment(${p.id}, ${p.allow_publish})">
                        ${p.allow_publish ? '关闭评论' : '开启评论'}
                    </button>
                    <button class="btn-danger" onclick="deletePost(${p.id})">删除帖子</button>
                </div>
            </div>`;
        }).join('');
    }

    // 🔴 新增：发送官方回复
    async function sendOfficialReply(postId){
        const input = document.getElementById(`officialReply${postId}`);
        const content = input.value.trim();
        if(!content) return alert('请输入回复内容');

        const {error} = await supabaseClient
            .from('comments')
            .insert([{
                post_id: postId, 
                content: content,
                is_official: true // 标记为官方回复
            }]);
        
        if(error){
            alert('回复失败：'+error.message);
            return;
        }

        input.value = '';
        loadAllPosts(); // 重新加载显示新回复
    }

    // 切换评论状态
    async function toggleComment(id, currentStatus){
        const {error} = await supabaseClient
            .from('posts')
            .update({allow_publish: !currentStatus})
            .eq('id', id);
        
        if(error){
            alert('操作失败：' + error.message);
            return;
        }
        loadAllPosts();
    }

    // 删除帖子
    async function deletePost(id){
        if(!confirm('确定要删除这条帖子吗？所有回复也会被一起删除！此操作不可恢复！'))return;
        
        const {error} = await supabaseClient
            .from('posts')
            .delete()
            .eq('id', id);
        
        if(error){
            alert('删除失败：' + error.message);
            return;
        }
        loadAllPosts();
    }

    // 删除评论
    async function deleteComment(id){
        if(!confirm('确定要删除这条回复吗？'))return;
        
        const {error} = await supabaseClient
            .from('comments')
            .delete()
            .eq('id', id);
        
        if(error){
            alert('删除失败：' + error.message);
            return;
        }
        loadAllPosts();
    }
</script>
</body>
</html>
